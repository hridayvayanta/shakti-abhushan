<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>SHAKTI ABHUSHAN — Luxury Indian Brass Jewellery</title>
    <meta name="description" content="Discover Shakti Abhushan — Handcrafted luxury Indian brass jewellery. Clean, elegant shopping with authentic video reels and direct WhatsApp orders." />
    
    <!-- Google Fonts: Cormorant Garamond & Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Header match color -->
    <meta name="theme-color" content="#061507" />

    <!-- Single Page Apps for GitHub Pages routing restoration -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-[#F9F7F2] text-[#263028] font-sans antialiased selection:bg-[#C39C69] selection:text-[#FFFFFF] overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
